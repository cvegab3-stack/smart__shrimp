# Proxy inverso por HTTP hacia Django (docker-compose.yml). No expone el microservicio de IA.
# Para usar HTTP con Django en producción, .env.docker debe tener DJANGO_HTTPS=0 (solo en una red local de confianza).
upstream django {
    server django:8000;
}

server {
    listen 80;
    server_name _;
    # Los fotogramas llegan como JSON en base64: deja margen sobre el tamaño de una imagen.
    client_max_body_size 20m;

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    # /media/ NO se sirve aquí: las imágenes de los análisis pasan por Django, que comprueba el permiso del usuario.
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
