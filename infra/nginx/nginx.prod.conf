# Proxy inverso en producción hacia Django (HTTPS, estáticos). No publica el microservicio de IA.
# Usado por docker-compose.https.yml. Certificados en infra/nginx/certs/fullchain.pem y privkey.pem.
upstream django {
    server django:8000;
}

# Todo el tráfico HTTP se redirige a HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 20m;

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    # /media/ NO se sirve aquí: las imágenes de los análisis pasan por Django, que comprueba el permiso del usuario.
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
