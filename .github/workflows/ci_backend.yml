name: Backend CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ./contracts
      - run: python -m pip install -r requirements/development.txt
        working-directory: backend
      - run: python -m ruff check backend contracts
      - run: python -m pytest backend/apps/accounts/tests backend/apps/analysis/tests backend/apps/results/tests
