[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
pythonpath = ["backend", "vision_service", "contracts"]
testpaths = ["contracts/tests", "backend/apps", "vision_service/tests", "tests_integration"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
